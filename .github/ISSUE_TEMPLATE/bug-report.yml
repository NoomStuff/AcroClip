name: Bug report
description: Something in AcroClip doesn't work the way it should
labels: ["bug"]
body:
   - type: markdown
     attributes:
        value: Use **Report a bug** in the app (Settings → App → Troubleshooting). It saves your logs and fills in your version. One bug per issue.
   - type: textarea
     id: what-happened
     attributes:
        label: What happened?
        description: Error messages word for word, if there were any.
        placeholder: I pressed Alt+C during a match. It said "Clip saved", but the clip was 2 seconds of black screen.
     validations:
        required: true
   - type: textarea
     id: expected
     attributes:
        label: What did you expect?
        placeholder: A 60 second clip of the match, with game audio.
     validations:
        required: true
   - type: textarea
     id: steps
     attributes:
        label: How can it be reproduced?
        description: Steps from opening AcroClip to the bug, and how often it happens. Skip the steps if you have no idea.
        placeholder: |
           1. Set Capture to Auto
           2. Launch the game in exclusive fullscreen
           3. Save a clip
   - type: input
     id: version
     attributes:
        label: AcroClip version
        placeholder: "x.y.z"
     validations:
        required: true
   - type: textarea
     id: logs
     attributes:
        label: Logs
        description: |
           Drag in the zip from Report a bug or Export logs. If AcroClip won't open, zip the `logs` folder in `%APPDATA%\AcroClip`, `~/.config/AcroClip` or `~/Library/Application Support/AcroClip`.
           It holds logs, settings, device names and window titles. Never clips, and your user folder shows as `~`.
   - type: checkboxes
     id: checks
     attributes:
        label: Before you send it
        options:
           - label: I searched the existing issues and this one is new.
             required: true
           - label: I'm on the newest AcroClip release, or I said above why I'm not.
             required: true
