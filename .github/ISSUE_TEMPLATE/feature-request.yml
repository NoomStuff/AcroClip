name: Feature request
description: An idea that makes clipping, rewatching or sharing better
labels: ["enhancement"]
body:
   - type: markdown
     attributes:
        value: Full-session recording belongs in OBS and cutting belongs in AttaCut. If your idea is one of those, say why it belongs in AcroClip anyway.
   - type: textarea
     id: idea
     attributes:
        label: What should AcroClip do?
        description: Rough is fine.
        placeholder: Let me mark a clip as a highlight from the save notification, and show highlights first in the library.
     validations:
        required: true
   - type: textarea
     id: problem
     attributes:
        label: Why do you want it?
        description: What you were trying to do and what got in the way.
        placeholder: After a long session I have 40 clips and no idea which ones had the good moments.
     validations:
        required: true
   - type: checkboxes
     id: checks
     attributes:
        label: Before you send it
        options:
           - label: I searched the existing issues and this idea is new.
             required: true
           - label: I'm willing to implement this feature myself.
