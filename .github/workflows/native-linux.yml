name: Linux capture

on:
   push:
   pull_request:
   workflow_dispatch:
      inputs:
         release_candidate:
            description: Verify and retain a complete release source packet
            type: boolean
            default: false

permissions:
   contents: read

jobs:
   actual-capture:
      runs-on: ubuntu-24.04
      timeout-minutes: 120
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - name: Install matching OBS headers and runtime
           run: |
              sudo add-apt-repository -y ppa:obsproject/obs-studio
              sudo apt-get update
              sudo apt-get install -y obs-studio=32.2.0-0obsproject1~noble cmake g++ make pkg-config patch python3 libx11-dev libxcb-composite0-dev libpulse-dev libsimde-dev libwayland-dev libglib2.0-dev libpipewire-0.3-dev libdrm-dev xvfb openbox x11-apps x11-utils x11-xserver-utils ffmpeg pulseaudio pulseaudio-utils gcc-mingw-w64-x86-64 wine64 sway xwayland pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr meson ninja-build libsystemd-dev libinih-dev wayland-protocols
         - name: Build native X11 recorder
           run: bun scripts/build-native-linux.ts
         - name: Verify source exception rejects tampered module evidence
           run: |
              python3 scripts/collect-linux-sources.test.py
              python3 scripts/controlled_wayland_sources.test.py
         - name: Build isolated application audio fixtures
           run: |
              cmake -S native/tests -B .cache/native-tests-linux -DCMAKE_BUILD_TYPE=Release
              cmake --build .cache/native-tests-linux -j2
         - name: Verify device audio health, recovery, gain and synchronization
           run: python3 scripts/smoke-linux-device-audio.py resources/recorder
         - name: Verify selected application audio isolation and recovery
           run: python3 scripts/smoke-linux-app-audio.py resources/recorder
         - name: Verify real Wine image identity and application capture
           run: python3 scripts/smoke-wine.py resources/recorder
         - name: Verify accepted saves and capture after process interruption
           run: python3 scripts/smoke-interruption.py resources/recorder
         - name: Record actual screen and audio
           run: python3 scripts/smoke-linux.py resources/recorder
           env:
              ACROCLIP_TEST_X11_APP: "1"
         - name: Build private monitor portal fixture
           run: python3 scripts/build-wayland-fixture.py
         - name: Verify actual Wayland pixels, audio, permission and stream loss
           run: python3 scripts/smoke-wayland.py resources/recorder
         - name: Verify exact XWayland and Wine pixels, audio privacy and target loss
           run: python3 scripts/smoke-xwayland.py resources/recorder
           env:
              ACROCLIP_XWAYLAND_ADAPTER_TEST: "1"
         - run: bun install --frozen-lockfile
         - name: Stage pinned standalone media for the private package test
           run: bun scripts/provision-media.ts
         - name: Build controlled release media
           if: inputs.release_candidate == true
           run: |
              sudo apt-get install -y nasm meson ninja-build pkg-config unzip
              bun scripts/release-sources.ts --controlled-inputs --collect-only
              bash scripts/build-media-linux.sh
              ACROCLIP_REFERENCE_FFMPEG="$FFMPEG_PATH" python3 scripts/smoke-controlled-media-linux.py
              bun scripts/controlled-media-linux.ts
              echo "FFMPEG_PATH=$PWD/work/controlled-media/linux-x64/ffmpeg" >> "$GITHUB_ENV"
              echo "FFPROBE_PATH=$PWD/work/controlled-media/linux-x64/ffprobe" >> "$GITHUB_ENV"
         - run: bun run bundle:media
         - run: bun run build:icons
         - run: bun run build:notices
         - run: bun run build
         - name: Build the AppImage without publishing
           run: bunx electron-builder --linux AppImage --publish never
         - name: Verify actual AppImage capture, playback and sharing
           run: bun run test:packaged:linux release/*.AppImage
         - name: Recover immutable corresponding-source inputs
           if: inputs.release_candidate == true
           run: |
              python3 scripts/recover-release-inputs.py --platform linux-x64 --destination work/linux-release-sources
              python3 scripts/collect-linux-sources.py --stage resources/recorder --output work/linux-release-sources
              python3 scripts/linux-source-inputs.py --sources work/linux-release-sources --notices work/linux-release-notices
              bun -e 'import {collectElectronFfmpeg} from "./scripts/electron-source-evidence"; const root="work/linux-release-sources"; const component=await collectElectronFfmpeg(process.cwd(),root,{platform:"linux",arch:"x64"}); await Bun.write(root+"/electron-component.json",JSON.stringify(component,null,2));'
         - name: Stage full notices and bind the final AppImage to its source packet
           if: inputs.release_candidate == true
           run: |
              bun scripts/linux-source-kit.ts . --stage-notices
              bunx electron-builder --linux AppImage --publish never
              bun scripts/linux-source-kit.ts .
              bun scripts/linux-source-kit.ts . --check
              bun scripts/package-linux-source-kit.ts
              taskSource=$(find work -maxdepth 1 -name 'AcroClip-*-linux-x64-sources-*.zip' -type f)
              taskImage=$(find release -maxdepth 1 -name 'AcroClip-*-linux-*.AppImage' -type f)
              bun scripts/verify-linux-release.ts "$PWD" "$PWD" "$taskSource" "$taskImage" work/linux-release-sources
              bun run test:packaged:linux "$taskImage"
         - name: Retain the verified Linux candidate
           if: inputs.release_candidate == true
           uses: actions/upload-artifact@v7
           with:
              name: Linux-verified-release-candidate
              path: |
                 release/AcroClip-*.AppImage
                 release/AcroClip-*.AppImage.release.json
                 release/latest-linux.yml
                 work/AcroClip-*-linux-x64-sources-*.zip
                 work/AcroClip-*-linux-x64-sources-*.zip.json
              if-no-files-found: error
              retention-days: 14
         - name: Keep synthetic capture evidence
           if: always()
           run: |
              python3 - <<'PY'
              from pathlib import Path
              from shutil import copyfile
              names = {"measurements.json", "events.json", "wine-proof.json", "interruption-proof.json", "wayland-proof.json", "xwayland-proof.json", "report.json", "device-audio-proof.json"}
              destination = Path(".cache/linux-capture-evidence")
              for area in ("linux-smoke", "linux-packaged"):
                  root = Path(".cache") / area
                  if not root.exists():
                      continue
                  for proof in root.iterdir():
                      if proof.is_symlink() or not proof.is_dir():
                          continue
                      for source in proof.iterdir():
                          if source.is_symlink() or not source.is_file():
                              continue
                          if source.name not in names and source.suffix != ".log":
                              continue
                          target = destination / area / proof.name / source.name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          copyfile(source, target)
              PY
         - name: Upload synthetic capture evidence
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: linux-capture-evidence
              path: .cache/linux-capture-evidence/
              if-no-files-found: ignore
         - name: Retain source verification diagnostics
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: linux-source-diagnostics
              path: |
                 work/linux-release-sources/manifest.json
                 work/linux-release-sources/apt/update.log
                 work/linux-release-sources/controlled-modules/**/*.json
              if-no-files-found: ignore
