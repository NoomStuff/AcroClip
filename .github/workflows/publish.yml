name: Publish reviewed release
run-name: Publish reviewed candidate ${{ inputs.run_id }} attempt ${{ inputs.attempt }} at ${{ inputs.commit }}
on:
   workflow_dispatch:
      inputs:
         run_id:
            description: Successful Release candidate run ID
            required: true
         attempt:
            description: Exact successful run attempt
            required: true
         commit:
            description: Full verified main commit SHA
            required: true
         source_release:
            description: Published reviewed source-only release URL
            required: true
         correspondence_review:
            description: Confirm review of all five source packets and exact binary correspondence
            type: boolean
            required: true
            default: false
permissions:
   contents: read
   actions: read
concurrency:
   group: release-publication
   cancel-in-progress: false
jobs:
   publish:
      runs-on: ubuntu-24.04
      environment: release
      permissions:
         contents: write
         actions: read
      steps:
         - name: Validate reviewed candidate identity
           uses: actions/github-script@v9
           env:
              CANDIDATE_RUN: ${{ inputs.run_id }}
              CANDIDATE_ATTEMPT: ${{ inputs.attempt }}
              CANDIDATE_COMMIT: ${{ inputs.commit }}
              REVIEWED: ${{ inputs.correspondence_review }}
           with:
              script: |
                 const runId = process.env.CANDIDATE_RUN;
                 const attempt = process.env.CANDIDATE_ATTEMPT;
                 const sha = process.env.CANDIDATE_COMMIT;
                 if (process.env.REVIEWED !== 'true' || !/^\d+$/.test(runId) || !/^\d+$/.test(attempt) || !/^[a-f0-9]{40}$/.test(sha)) throw Error('Exact candidate identity and correspondence review required');
                 const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(runId)})).data;
                 if (run.path !== '.github/workflows/build.yml' || run.head_repository.full_name !== context.payload.repository.full_name || run.head_branch !== 'main' || run.head_sha !== sha || run.run_attempt !== Number(attempt) || run.conclusion !== 'success') throw Error('Candidate run is not the requested successful verification');
                 const main = (await github.rest.git.getRef({...context.repo, ref: 'heads/main'})).data.object.sha;
                 if (context.ref !== 'refs/heads/main' || context.sha !== sha || main !== sha) throw Error('Stale candidate. Verify current main again before publication');
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.commit }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - run: bun install --frozen-lockfile
         - uses: actions/download-artifact@v8
           with:
              name: sealed-release-candidate
              run-id: ${{ inputs.run_id }}
              github-token: ${{ github.token }}
              path: candidate
         - run: bun scripts/release-candidate.ts candidate
         - name: Publish exact reviewed bytes and updater feeds
           uses: actions/github-script@v9
           env:
              CANDIDATE_RUN: ${{ inputs.run_id }}
              CANDIDATE_ATTEMPT: ${{ inputs.attempt }}
              CANDIDATE_COMMIT: ${{ inputs.commit }}
              SOURCE_RELEASE_URL: ${{ inputs.source_release }}
           with:
              script: |
                 const publish = require('./scripts/publish-release.cjs');
                 await publish({github, context, core});
