name: Release
"on":
   push:
      branches:
         - main
   workflow_dispatch:
      inputs:
         candidate_sha:
            description: Optional exact commit for private candidate verification
            type: string
            default: ""
         verify_candidate:
            description: Verify all five targets without publishing
            type: boolean
            default: false
permissions:
   contents: read
concurrency:
   group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.verify_candidate || inputs.candidate_sha != '') && github.run_id || 'main' }}
   cancel-in-progress: false
jobs:
   prepare:
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      outputs:
         candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
         version: ${{ steps.prepare.outputs.version }}
         native_linux: ${{ steps.prepare.outputs.native_linux }}
         native_macos: ${{ steps.prepare.outputs.native_macos }}
         build: ${{ steps.prepare.outputs.build }}
         publish: ${{ steps.prepare.outputs.publish }}
         tag: ${{ steps.prepare.outputs.tag }}
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha || github.sha }}
              fetch-depth: 2
         - uses: actions/github-script@v9
           id: prepare
           with:
              script: await require('./scripts/ci-preflight.cjs')({github, context, core});
   checks:
      needs: prepare
      uses: ./.github/workflows/verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   media:
      needs:
         - prepare
         - checks
      uses: ./.github/workflows/controlled-media.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   app-checks:
      needs:
         - prepare
         - checks
         - media
      uses: ./.github/workflows/app-checks.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   native-checks:
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build != 'true' && (needs.prepare.outputs.native_linux == 'true' || needs.prepare.outputs.native_macos == 'true')
      uses: ./.github/workflows/native-checks.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         linux: ${{ needs.prepare.outputs.native_linux == 'true' }}
         mac: ${{ needs.prepare.outputs.native_macos == 'true' }}
   build:
      needs:
         - prepare
         - checks
         - media
      if: needs.prepare.outputs.build == 'true'
      uses: ./.github/workflows/candidate-build.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   verify:
      needs:
         - prepare
         - build
         - build-linux
         - build-mac
      uses: ./.github/workflows/candidate-verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
      if: needs.prepare.outputs.build == 'true'
   check:
      needs:
         - prepare
         - checks
         - media
         - app-checks
         - native-checks
         - build
         - verify
         - build-linux
         - build-mac
      if: always()
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      env:
         CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      steps:
         - name: Require all expected checks
           uses: actions/github-script@v9
           env:
              RESULTS: ${{ toJSON(needs) }}
           with:
              script: |
                 const jobs = JSON.parse(process.env.RESULTS);
                 const candidate = jobs.prepare.outputs.build === 'true';
                 const native = !candidate && (jobs.prepare.outputs.native_linux === 'true' || jobs.prepare.outputs.native_macos === 'true');
                 for (const [name, job] of Object.entries(jobs)) {
                   const expected = ['build', 'build-linux', 'build-mac', 'verify'].includes(name) ? candidate : name === 'native-checks' ? native : true;
                   if (job.result !== (expected ? 'success' : 'skipped')) throw Error(`${name}: ${job.result}`);
                 }
         - uses: actions/checkout@v7
           if: needs.prepare.outputs.build == 'true'
           with:
              ref: ${{ needs.prepare.outputs.candidate_sha }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
           if: needs.prepare.outputs.build == 'true'
         - run: bun install --frozen-lockfile
           if: needs.prepare.outputs.build == 'true'
         - uses: actions/download-artifact@v8
           if: needs.prepare.outputs.build == 'true'
           with:
              pattern: verified-*
              path: verified
         - name: Seal exact verified candidate
           if: needs.prepare.outputs.build == 'true'
           run: |-
              bun scripts/ci-stage.ts seal verified candidates
              bun scripts/release-candidate.ts candidates candidate
         - uses: actions/upload-artifact@v7
           with:
              name: sealed-release-candidate
              path: candidate/
              if-no-files-found: error
              retention-days: 14
              compression-level: 0
           if: needs.prepare.outputs.build == 'true'
   publish:
      name: Publish verified release
      needs:
         - prepare
         - check
      permissions:
         contents: write
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ needs.prepare.outputs.candidate_sha }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
         - run: bun install --frozen-lockfile
         - uses: actions/download-artifact@v8
           with:
              name: sealed-release-candidate
              path: candidate
         - run: bun scripts/release-candidate.ts candidate
         - name: Publish verified sources, app downloads and updater feeds
           uses: actions/github-script@v9
           with:
              script: |
                 const publish = require('./scripts/publish-release.cjs');
                 await publish({github, context, core});
      # Override the implicit success() check after the optional native job is skipped.
      if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.check.result == 'success' }}
   build-linux:
      strategy:
         fail-fast: false
         matrix:
            architecture:
               - x64
               - arm64
      uses: ./.github/workflows/native-linux.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         architecture: ${{ matrix.architecture }}
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build == 'true'
   build-mac:
      strategy:
         fail-fast: false
         matrix:
            architecture:
               - x64
               - arm64
      uses: ./.github/workflows/native-macos.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         architecture: ${{ matrix.architecture }}
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build == 'true'
