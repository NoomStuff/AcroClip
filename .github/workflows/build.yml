name: Release
"on":
   push:
      branches:
         - main
   workflow_dispatch:
      inputs:
         candidate_sha:
            description: Optional exact commit for private candidate verification
            type: string
            default: ""
         verify_candidate:
            description: Verify all five targets without publishing
            type: boolean
            default: false
permissions:
   contents: read
concurrency:
   group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.verify_candidate || inputs.candidate_sha != '') && github.run_id || 'main' }}
   cancel-in-progress: false
jobs:
   prepare:
      permissions:
         contents: read
         statuses: write
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      outputs:
         candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
         version: ${{ steps.prepare.outputs.version }}
         native_linux: ${{ steps.prepare.outputs.native_linux }}
         native_macos: ${{ steps.prepare.outputs.native_macos }}
         build: ${{ steps.prepare.outputs.build }}
         publish: ${{ steps.prepare.outputs.publish }}
         tag: ${{ steps.prepare.outputs.tag }}
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha || github.sha }}
              fetch-depth: 2
         - uses: actions/github-script@v9
           id: prepare
           with:
              script: await require('./scripts/ci-preflight.cjs')({github, context, core});
         - name: Report candidate verification on the source commit
           if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.publish != 'true'
           uses: actions/github-script@v9
           env:
              CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_sha }}
           with:
              script: |
                 const sha = process.env.CANDIDATE_SHA;
                 if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid candidate commit');
                 await github.rest.repos.createCommitStatus({
                   ...context.repo, sha, state: 'pending', context: 'Release candidate',
                   description: 'Verifying the app, native capture and all five packages',
                   target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                 });
   checks:
      needs: prepare
      uses: ./.github/workflows/verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   media:
      needs: prepare
      uses: ./.github/workflows/controlled-media.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   app-checks:
      needs:
         - prepare
         - checks
         - media
      uses: ./.github/workflows/app-checks.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   native-checks:
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build != 'true' && (needs.prepare.outputs.native_linux == 'true' || needs.prepare.outputs.native_macos == 'true')
      uses: ./.github/workflows/native-checks.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         linux: ${{ needs.prepare.outputs.native_linux == 'true' }}
         mac: ${{ needs.prepare.outputs.native_macos == 'true' }}
   build:
      needs:
         - prepare
         - checks
         - media
      if: needs.prepare.outputs.build == 'true'
      uses: ./.github/workflows/candidate-build.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
   verify-windows:
      needs:
         - prepare
         - build
      uses: ./.github/workflows/candidate-verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         targets: '[{"target":"win-x64","os":"windows-2025"}]'
      if: needs.prepare.outputs.build == 'true'
   # Each target verifies as soon as its own package exists, instead of waiting
   # for the slower architecture of the same platform.
   verify-linux-x64:
      needs:
         - prepare
         - build-linux-x64
      uses: ./.github/workflows/candidate-verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         targets: '[{"target":"linux-x64","os":"ubuntu-24.04"}]'
      if: needs.prepare.outputs.build == 'true'
   verify-linux-arm64:
      needs:
         - prepare
         - build-linux-arm64
      uses: ./.github/workflows/candidate-verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         targets: '[{"target":"linux-arm64","os":"ubuntu-24.04-arm"}]'
      if: needs.prepare.outputs.build == 'true'
   verify-mac-x64:
      needs:
         - prepare
         - build-mac-x64
      uses: ./.github/workflows/candidate-verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         targets: '[{"target":"mac-x64","os":"macos-15-intel"}]'
      if: needs.prepare.outputs.build == 'true'
   verify-mac-arm64:
      needs:
         - prepare
         - build-mac-arm64
      uses: ./.github/workflows/candidate-verify.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         targets: '[{"target":"mac-arm64","os":"macos-15"}]'
      if: needs.prepare.outputs.build == 'true'
   check:
      permissions:
         contents: read
         statuses: write
      needs:
         - prepare
         - checks
         - media
         - app-checks
         - native-checks
         - build
         - verify-windows
         - verify-linux-x64
         - verify-linux-arm64
         - verify-mac-x64
         - verify-mac-arm64
         - build-linux-x64
         - build-linux-arm64
         - build-mac-x64
         - build-mac-arm64
      if: always()
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      env:
         CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      steps:
         - name: Require all expected checks
           uses: actions/github-script@v9
           env:
              RESULTS: ${{ toJSON(needs) }}
           with:
              script: |
                 const jobs = JSON.parse(process.env.RESULTS);
                 const candidate = jobs.prepare.outputs.build === 'true';
                 const native = !candidate && (jobs.prepare.outputs.native_linux === 'true' || jobs.prepare.outputs.native_macos === 'true');
                 for (const [name, job] of Object.entries(jobs)) {
                   const expected = name === 'build' || /^(build|verify)-(windows|linux|mac)/.test(name) ? candidate : name === 'native-checks' ? native : true;
                   if (job.result !== (expected ? 'success' : 'skipped')) throw Error(`${name}: ${job.result}`);
                 }
         - uses: actions/checkout@v7
           if: needs.prepare.outputs.build == 'true'
           with:
              ref: ${{ needs.prepare.outputs.candidate_sha }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
           if: needs.prepare.outputs.build == 'true'
         - run: bun install --frozen-lockfile
           if: needs.prepare.outputs.build == 'true'
         - uses: actions/download-artifact@v8
           if: needs.prepare.outputs.build == 'true'
           with:
              pattern: verified-*
              path: verified
         - name: Seal exact verified candidate
           if: needs.prepare.outputs.build == 'true'
           run: |-
              bun scripts/ci-stage.ts seal verified candidates
              bun scripts/release-candidate.ts candidates candidate
         - uses: actions/upload-artifact@v7
           with:
              name: sealed-release-candidate
              path: candidate/
              if-no-files-found: error
              retention-days: 14
              compression-level: 0
           if: needs.prepare.outputs.build == 'true'
         - name: Report the sealed candidate result on the source commit
           if: always() && needs.prepare.outputs.build == 'true' && needs.prepare.outputs.publish != 'true'
           uses: actions/github-script@v9
           env:
              VERIFICATION_STATUS: ${{ job.status }}
           with:
              script: |
                 const sha = process.env.CANDIDATE_SHA;
                 if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid candidate commit');
                 const passed = process.env.VERIFICATION_STATUS === 'success';
                 await github.rest.repos.createCommitStatus({
                   ...context.repo, sha, state: passed ? 'success' : 'failure', context: 'Release candidate',
                   description: passed ? 'All five packages verified and candidate sealed' : 'Candidate verification failed',
                   target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                 });
   publish:
      name: Publish verified release
      needs:
         - prepare
         - check
      permissions:
         contents: write
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ needs.prepare.outputs.candidate_sha }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
         - run: bun install --frozen-lockfile
         - uses: actions/download-artifact@v8
           with:
              name: sealed-release-candidate
              path: candidate
         - run: bun scripts/release-candidate.ts candidate
         - name: Publish verified sources, app downloads and updater feeds
           uses: actions/github-script@v9
           with:
              script: |
                 const publish = require('./scripts/publish-release.cjs');
                 const releaseName = require('./package.json').build.releaseInfo?.releaseName;
                 await publish({github, context, core, releaseName});
      # Override the implicit success() check after the optional native job is skipped.
      if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.check.result == 'success' }}
   build-linux-x64:
      uses: ./.github/workflows/native-linux.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         architecture: x64
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build == 'true'
   build-linux-arm64:
      uses: ./.github/workflows/native-linux.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         architecture: arm64
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build == 'true'
   build-mac-x64:
      uses: ./.github/workflows/native-macos.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         architecture: x64
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build == 'true'
   build-mac-arm64:
      uses: ./.github/workflows/native-macos.yml
      with:
         candidate_sha: ${{ needs.prepare.outputs.candidate_sha }}
         architecture: arm64
      needs:
         - prepare
         - checks
      if: needs.prepare.outputs.build == 'true'
