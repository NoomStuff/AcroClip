name: Desktop builds
on:
   workflow_dispatch:
   push:
      tags: ["v*"]
permissions:
   contents: read
jobs:
   controlled-media:
      uses: ./.github/workflows/controlled-media.yml
   package:
      needs: controlled-media
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: windows-2025, target: win-x64 }
               - { os: macos-15-intel, target: mac-x64 }
               - { os: macos-15, target: mac-arm64 }
               - { os: ubuntu-24.04, target: linux-x64 }
               - { os: ubuntu-24.04-arm, target: linux-arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - run: bun install --frozen-lockfile
         - uses: actions/download-artifact@v8
           if: runner.os == 'Windows'
           with:
              name: controlled-windows-media
              path: work/
         - name: Verify and record the cross build on Windows
           if: runner.os == 'Windows'
           run: bun scripts/controlled-media.ts
         - run: bun scripts/provision-media.ts
           if: runner.os != 'macOS'
         - name: Build controlled macOS media
           if: runner.os == 'macOS'
           run: |
              brew install ffmpeg-full meson ninja pkg-config nasm
              taskReference="$(brew --prefix ffmpeg-full)/bin/ffmpeg"
              bun scripts/release-sources.ts --controlled-inputs --collect-only
              bash scripts/build-media-macos.sh
              ACROCLIP_REFERENCE_FFMPEG="$taskReference" python3 scripts/smoke-controlled-media-macos.py
              bun scripts/controlled-media-macos.ts
              echo "FFMPEG_PATH=$PWD/work/controlled-media/macos-$(bun -p process.arch)/ffmpeg" >> "$GITHUB_ENV"
              echo "FFPROBE_PATH=$PWD/work/controlled-media/macos-$(bun -p process.arch)/ffprobe" >> "$GITHUB_ENV"
         - run: bun run bundle:media
         - run: bun run build:icons
         - run: bun run build:notices
         - name: Build application
           run: bun run build
         - name: Install matching Linux recorder dependencies
           if: runner.os == 'Linux'
           run: |
              if [ "$(uname -m)" = aarch64 ]; then
                 echo 'deb http://ports.ubuntu.com/ubuntu-ports noble-backports main universe' | sudo tee /etc/apt/sources.list.d/acroclip-backports.list
              else
                 sudo add-apt-repository -y ppa:obsproject/obs-studio
              fi
              sudo apt-get update
              if [ "$(uname -m)" = aarch64 ]; then
                 sudo apt-get install -y obs-studio=30.2.3+dfsg-3~bpo24.04.1 libobs-dev=30.2.3+dfsg-3~bpo24.04.1 libobs0t64=30.2.3+dfsg-3~bpo24.04.1 obs-plugins=30.2.3+dfsg-3~bpo24.04.1
              else
                 sudo apt-get install -y obs-studio=32.2.0-0obsproject1~noble
              fi
              sudo apt-get install -y cmake g++ make pkg-config patch python3 libx11-dev libxcb-composite0-dev libpulse-dev libsimde-dev libwayland-dev libglib2.0-dev libpipewire-0.3-dev libdrm-dev
         - name: Build recorder
           run: bun run build:native
         - name: Package without automatic publishing
           run: bunx electron-builder --publish never
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: "false"
         - name: Record build details
           shell: bash
           run: |
              mkdir -p build-report
              cp resources/media/provenance.json build-report/media-provenance.json
              cp resources/recorder/provenance.json build-report/recorder-provenance.json 2>/dev/null || cp resources/recorder/UNAVAILABLE.txt build-report/recorder-status.txt
              find release -maxdepth 1 -type f -print > build-report/artifacts.txt
         - uses: actions/upload-artifact@v7
           with:
              name: build-report-${{ matrix.target }}
              path: build-report/
              retention-days: 14

         - name: Keep private release candidates for verification
           uses: actions/upload-artifact@v7
           with:
              name: desktop-candidate-${{ matrix.target }}
              path: |
                 release/AcroClip-*.exe
                 release/AcroClip-*.exe.blockmap
                 release/AcroClip-*.AppImage
                 release/AcroClip-*.dmg
                 release/AcroClip-*.zip
                 release/AcroClip-*.zip.blockmap
                 release/latest*.yml
              if-no-files-found: error
              retention-days: 7
