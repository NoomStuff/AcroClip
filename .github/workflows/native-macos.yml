name: macOS native capture
on:
   workflow_dispatch:
      inputs:
         architecture:
            type: choice
            options: [arm64, x64]
            default: arm64
   push:
      paths:
         - native/macos/**
         - native/recorder.cpp
         - native/clip-writer.*
         - native/CMakeLists.txt
         - scripts/build-recorder-macos.ts
         - scripts/smoke-macos.py
         - scripts/smoke-macos-audio.py
         - scripts/smoke-macos-feedback.py
         - scripts/build-media-macos.sh
         - scripts/controlled-media-macos.ts
         - scripts/smoke-controlled-media-macos.py
         - scripts/probe-macos-source-runtime.py
         - scripts/collect-macos-electron.ts
         - scripts/macos-*.ts
         - scripts/verify-macos-release.ts
         - scripts/package-macos-source-kit.ts
         - scripts/package-macos-sources.py
         - scripts/extract-macos-package.py
         - scripts/test-macos-packaged.ts
         - scripts/close-test-application.ts
         - .github/workflows/native-macos.yml
permissions:
   contents: read
jobs:
   capture:
      runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
      timeout-minutes: 120
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - run: bun install --frozen-lockfile
         - name: Install build tools and independent fixture generator
           run: |
              brew install ffmpeg-full meson ninja pkg-config nasm
              taskReference="$(brew --prefix ffmpeg-full)/bin"
              echo "FFMPEG_PATH=$taskReference/ffmpeg" >> "$GITHUB_ENV"
              echo "FFPROBE_PATH=$taskReference/ffprobe" >> "$GITHUB_ENV"
              mkdir -p work/reference-media
              brew info --json=v2 ffmpeg-full > work/reference-media/homebrew.json
              "$taskReference/ffmpeg" -encoders > work/reference-media/encoders.txt
              "$taskReference/ffmpeg" -version > work/reference-media/ffmpeg-version.txt
              "$taskReference/ffprobe" -version > work/reference-media/ffprobe-version.txt
              shasum -a 256 "$taskReference/ffmpeg" "$taskReference/ffprobe" > work/reference-media/SHA256SUMS.txt
         - name: Collect immutable media source inputs
           run: bun scripts/release-sources.ts --controlled-inputs --collect-only
         - name: Restore verified media for this architecture
           id: media_cache
           uses: actions/cache/restore@v6.1.0
           with:
              path: work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}
              key: controlled-macos-${{ inputs.architecture || 'arm64' }}-${{ hashFiles('scripts/build-media-macos.sh', 'scripts/controlled-media-macos.ts', 'scripts/controlled-media.ts', 'scripts/smoke-controlled-media-macos.py') }}
         - name: Verify the recorded media cache before executing it
           if: steps.media_cache.outputs.cache-hit == 'true'
           run: bun -e 'import {readControlledMacBuild} from "./scripts/controlled-media-macos"; await readControlledMacBuild("work/controlled-media/macos-" + process.arch);'
         - name: Compile controlled macOS media
           if: steps.media_cache.outputs.cache-hit != 'true'
           env:
              ACROCLIP_MEDIA_BUILD_JOBS: "3"
           run: bash scripts/build-media-macos.sh
         - name: Verify independent codec fixtures and record actual build
           run: |
              ACROCLIP_REFERENCE_FFMPEG="$FFMPEG_PATH" python3 scripts/smoke-controlled-media-macos.py
              bun scripts/controlled-media-macos.ts
              echo "FFMPEG_PATH=$PWD/work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/ffmpeg" >> "$GITHUB_ENV"
              echo "FFPROBE_PATH=$PWD/work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/ffprobe" >> "$GITHUB_ENV"
         - name: Cache verified media for this architecture
           if: steps.media_cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@v6.1.0
           with:
              path: work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}
              key: controlled-macos-${{ inputs.architecture || 'arm64' }}-${{ hashFiles('scripts/build-media-macos.sh', 'scripts/controlled-media-macos.ts', 'scripts/controlled-media.ts', 'scripts/smoke-controlled-media-macos.py') }}
         - name: Stage verified media tools
           run: bun run bundle:media
         - name: Build and stage matching macOS recorder
           run: bun scripts/build-recorder-macos.ts
         - name: Compare actual provider binaries with official OBS and probe configuration
           run: DYLD_LIBRARY_PATH="$PWD/resources/recorder/Frameworks" python3 scripts/probe-macos-source-runtime.py
         - name: Capture matching OBS sources and stage every full native license
           run: |
              bun scripts/macos-obs-sources.ts
              bun scripts/macos-source-validation.ts
         - name: Prepare Electron corresponding sources and full licenses before packaging
           run: bun scripts/collect-macos-electron.ts --prepare
         - name: Verify actual screen and window recording with generated audio
           run: caffeinate -di python3 scripts/smoke-macos.py
         - name: Verify extra application and system audio
           run: caffeinate -di python3 scripts/smoke-macos-audio.py
         - name: Verify native feedback focus, animation and capture behavior
           run: caffeinate -di python3 scripts/smoke-macos-feedback.py --ci-motion-matrix
         - name: Record native crash diagnostics
           if: failure()
           continue-on-error: true
           run: |
              if test -x resources/recorder/acroclip-recorder; then
                 mkdir -p .cache/macos-native
                 lldb --batch -o 'process launch -i /dev/null' -o 'thread backtrace all' -- resources/recorder/acroclip-recorder "$PWD/resources/recorder" > .cache/macos-native/crash-backtrace.txt 2>&1
              fi
         - name: Build the actual macOS application
           run: |
              bun run build:icons
              bun run build:notices
              bun run build
              bunx electron-builder --mac zip --${{ inputs.architecture || 'arm64' }} --publish never
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: "false"
         - name: Verify packaged application capture and sharing
           timeout-minutes: 8
           run: caffeinate -di bun scripts/test-macos-packaged.ts
         - name: Capture matching Electron LGPL source evidence
           run: bun scripts/collect-macos-electron.ts
         - name: Assemble and verify the frozen Mac source packet
           run: |
              bun scripts/macos-source-kit.ts
              bun scripts/macos-source-kit.ts work/macos-release-sources --check
              bun scripts/package-macos-source-kit.ts
         - name: Verify the complete application ZIP, independent rebuild and updater
           run: |
              taskSource=$(find work -maxdepth 1 -name 'AcroClip-*-darwin-${{ inputs.architecture || 'arm64' }}-sources-*.zip' -type f)
              taskApp=$(find release -maxdepth 1 -name 'AcroClip-*-mac-${{ inputs.architecture || 'arm64' }}.zip' -type f)
              test -n "$taskSource" && test -n "$taskApp"
              bun scripts/verify-macos-release.ts work/macos-release-sources "$taskSource" "$taskApp"
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: "false"
         - name: Package the verified application as DMG
           run: |
              taskApp=$(find release -maxdepth 1 -name 'AcroClip-*-mac-*.zip' -type f)
              taskHash=$(shasum -a 256 "$taskApp" | cut -d' ' -f1)
              bun scripts/package-macos-dmg.ts "$taskApp" "$taskHash" release
         - uses: actions/upload-artifact@v7
           if: success()
           with:
              name: macOS-verified-release-candidate-${{ inputs.architecture || 'arm64' }}
              path: |
                 release/AcroClip-*-mac-${{ inputs.architecture || 'arm64' }}.dmg
                 release/AcroClip-*-mac-${{ inputs.architecture || 'arm64' }}.zip
                 release/AcroClip-*-mac-${{ inputs.architecture || 'arm64' }}.zip.blockmap
                 release/AcroClip-*-mac-${{ inputs.architecture || 'arm64' }}.zip.release.json
                 release/latest-mac.yml
                 work/AcroClip-*-darwin-${{ inputs.architecture || 'arm64' }}-sources-*.zip
                 work/AcroClip-*-darwin-${{ inputs.architecture || 'arm64' }}-sources-*.zip.json
              if-no-files-found: error
              retention-days: 14
         - uses: actions/upload-artifact@v7
           if: always()
           with:
              name: macOS-native-capture-proof-${{ inputs.architecture || 'arm64' }}
              path: |
                 .cache/macos-capture/**/proof.json
                 .cache/macos-capture/**/partial-proof.json
                 .cache/macos-capture/**/fixture-health.json
                 .cache/macos-capture/**/native-events.json
                 .cache/macos-capture/**/direct-sck.json
                 .cache/macos-capture/**/*.media.json
                 .cache/macos-capture/**/fixture.json
                 .cache/macos-capture/**/*.log
                 .cache/macos-native/link-proof.txt
                 .cache/macos-native/crash-backtrace.txt
                 .cache/macos-native/build/CMakeFiles/CMakeConfigureLog.yaml
                 .cache/macos-packaged/proof.json
                 .cache/macos-packaged/fixture.log
                 .cache/macos-packaged/application.log
                 .cache/macos-packaged/recording-states.json
                 .cache/macos-packaged/capture-source.json
                 .cache/macos-packaged/fixture-health.json
                 resources/recorder/provenance.json
                 resources/media/provenance.json
                 .cache/macos-audio/**/*.json
                 .cache/macos-audio/**/*.jsonl
                 .cache/macos-audio/**/*.log
                 .cache/macos-feedback/**/*.json
                 .cache/macos-feedback/**/*.jsonl
                 .cache/macos-feedback/**/*.log
                 .cache/macos-feedback/**/*-panel.png
                 .cache/macos-source/runtime-proof.json
                 .cache/macos-source/*-application-tree.json
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/*.json
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/*.txt
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/*.log
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/*.h
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/*.mak
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/*.sh
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/LICENSE*
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/COPYING*
                 work/controlled-media/macos-${{ inputs.architecture || 'arm64' }}/verification/
                 work/reference-media/
                 work/release-sources/manifest.json
                 work/release-sources/*.tar.gz
                 work/release-sources/dependencies/*.tar.gz
                 work/release-sources/licenses/
                 work/macos-release-sources/electron-component.json
                 work/macos-release-sources/macos-kit.json
                 work/macos-release-sources/obs-inputs.json
                 work/macos-release-sources/obs-source-validation.json
                 work/AcroClip-*-darwin-${{ inputs.architecture || 'arm64' }}-sources-*.zip
                 work/AcroClip-*-darwin-${{ inputs.architecture || 'arm64' }}-sources-*.zip.json
                 release/*.zip.release.json
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/*.tar.gz
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/*.txt
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/*.json
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/*.gn
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/*.h
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/*.patch
                 work/macos-release-sources/evidence/electron-ffmpeg-darwin-${{ inputs.architecture || 'arm64' }}/licenses/
              retention-days: 7
         - uses: actions/upload-artifact@v7
           if: always()
           with:
              name: macOS-native-feedback-proof-${{ inputs.architecture || 'arm64' }}
              path: |
                 .cache/macos-feedback/**/*.json
                 .cache/macos-feedback/**/*.jsonl
                 .cache/macos-feedback/**/*.log
                 .cache/macos-feedback/**/*-panel.png
              retention-days: 7
