name: Checks
"on":
   pull_request: null
   workflow_dispatch:
      inputs:
         interactive_suite:
            type: string
            default: ""
         expected_commit:
            type: string
            default: ""
         interactive_arguments:
            type: string
            default: "[]"
   workflow_call:
      inputs:
         interactive_suite:
            type: string
            default: ""
         expected_commit:
            type: string
            default: ""
         interactive_arguments:
            type: string
            default: "[]"
         candidate_sha:
            type: string
            default: ""
permissions:
   contents: read
concurrency:
   group: checks-${{ github.workflow }}-${{ github.ref }}-${{ inputs.interactive_suite || 'verify' }}
   cancel-in-progress: true
jobs:
   # Release-only packaging steps run on PRs that can affect them, so a release
   # never discovers them broken after merge. Detection fails open: if the PR's
   # files cannot be listed, the release smoke runs.
   changes:
      if: inputs.interactive_suite == ''
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      permissions:
         contents: read
         pull-requests: read
      outputs:
         release: ${{ steps.detect.outputs.release }}
      steps:
         - id: detect
           uses: actions/github-script@v9
           with:
              script: |
                 const releaseInputs = /^(scripts\/|native\/|build\/|resources\/|licenses\/|\.github\/|package\.json$|bun\.lock$|electron\.vite\.config\.ts$|THIRD_PARTY_NOTICES\.md$)/;
                 let release = true;
                 if (context.eventName === 'pull_request') {
                   try {
                     const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100 });
                     release = files.some((file) => releaseInputs.test(file.filename) || (file.previous_filename && releaseInputs.test(file.previous_filename)));
                   } catch (error) {
                     core.warning(`Could not list changed files, running the release smoke: ${error.message}`);
                   }
                 }
                 core.setOutput('release', String(release));
   controlled-media:
      uses: ./.github/workflows/controlled-media.yml
      with:
         candidate_sha: ${{ inputs.candidate_sha || github.sha }}
   verify:
      if: inputs.interactive_suite == ''
      uses: ./.github/workflows/verify.yml
      with:
         candidate_sha: ${{ inputs.candidate_sha || github.sha }}
   app:
      if: inputs.interactive_suite == ''
      needs: controlled-media
      uses: ./.github/workflows/app-checks.yml
      with:
         candidate_sha: ${{ inputs.candidate_sha || github.sha }}
   release-smoke:
      if: inputs.interactive_suite == '' && needs.changes.outputs.release == 'true'
      needs:
         - changes
         - controlled-media
      uses: ./.github/workflows/candidate-build.yml
      with:
         candidate_sha: ${{ inputs.candidate_sha || github.sha }}
         retain: false
   # The single result to require for merging. It fails when any job failed or
   # was cancelled, and allows a skip only where change detection explains it.
   check:
      name: Check
      if: always() && inputs.interactive_suite == ''
      needs:
         - changes
         - controlled-media
         - verify
         - app
         - release-smoke
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      steps:
         - name: Require every check
           uses: actions/github-script@v9
           env:
              RESULTS: ${{ toJSON(needs) }}
           with:
              script: |
                 const jobs = JSON.parse(process.env.RESULTS);
                 const optional = { 'release-smoke': jobs.changes.outputs?.release === 'false' };
                 for (const [name, job] of Object.entries(jobs)) {
                   core.info(`${name}: ${job.result}`);
                   if (job.result === 'success' || (job.result === 'skipped' && optional[name])) continue;
                   throw Error(`${name}: ${job.result}`);
                 }
   interactive:
      if: inputs.interactive_suite != ''
      needs: controlled-media
      runs-on: ${{ vars.ISOLATED_WINDOWS_RUNNER || 'windows-2025' }}
      timeout-minutes: 60
      env:
         ACROCLIP_ISOLATED_TEST_RUNNER: github-hosted
         ACROCLIP_PACKAGED_TEST_SOFTWARE: "1"
         ACROCLIP_NATIVE_TEST_SOFTWARE: "1"
         ACROCLIP_INTERACTIVE_SUITE: ${{ inputs.interactive_suite }}
         ACROCLIP_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
         ACROCLIP_INTERACTIVE_ARGUMENTS: ${{ inputs.interactive_arguments }}
      steps:
         - name: Require a disposable hosted runner
           env:
              ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
           run: |
              if ($env:ACTUAL_RUNNER_ENVIRONMENT -ne 'github-hosted') {
                 throw 'Interactive checks require a separately isolated disposable hosted runner, not a personal desktop runner'
              }
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha || github.sha }}
         - name: Verify the exact requested revision
           run: |
              if ($env:ACROCLIP_EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -ne $env:ACROCLIP_EXPECTED_COMMIT) {
                 throw 'The isolated test revision differs from the requested local commit'
              }
              Write-Output "Testing exact committed revision $env:ACROCLIP_EXPECTED_COMMIT in a disposable Windows runner"
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
         - run: bun install --frozen-lockfile
         - run: node node_modules/electron/install.js
         - uses: actions/download-artifact@v8
           with:
              name: controlled-windows-media
              path: work/
         - run: bun scripts/controlled-media.ts
         - run: bun scripts/provision-media.ts
         - run: bun run bundle:media
         - run: bun run build:icons
         - uses: ./.github/actions/native-windows-cache
         - run: bun run build:native
         - run: bun run build:notices
         - run: bun run build
         - name: Prepare private audio routing
           env:
              ACROCLIP_HOSTED_WINDOWS_FIXTURE: ${{ runner.environment }}
           run: |
              if ($env:ACROCLIP_INTERACTIVE_SUITE -in @('packaged','portable','installer','update')) {
                 pwsh -File scripts/setup-windows-runner-audio.ps1
              } else {
                 pwsh -File scripts/setup-windows-runner-audio.ps1 -EndpointOnly
              }
         - name: Prepare executable packages when requested
           if: contains(fromJSON('["packaged","portable","installer","update"]'), inputs.interactive_suite)
           run: bunx electron-builder --win --x64 --publish never
         - name: Run the unchanged interactive checks
           run: bun scripts/run-interactive-tests.ts "$env:ACROCLIP_INTERACTIVE_SUITE"
         - name: Stop the private tone producer
           if: always()
           run: |
              if ($env:ACROCLIP_AUDIO_FIXTURE_PID) {
                 $fixtureProcess = Get-CimInstance Win32_Process -Filter "ProcessId = $env:ACROCLIP_AUDIO_FIXTURE_PID"
                 if ($fixtureProcess.CommandLine -like '*setup-windows-runner-audio.ps1*' -and $fixtureProcess.CommandLine -like '*-PlayTone*') {
                    Stop-Process -Id $fixtureProcess.ProcessId -ErrorAction SilentlyContinue
                 }
              }
         - uses: actions/upload-artifact@v7
           if: always()
           with:
              overwrite: true
              name: isolated-test-evidence
              path: |
                 test-results/
                 .cache/native-*/**/*.json
                 .cache/native-*/**/*.log
                 .cache/native-*/**/*.mkv
                 .cache/update-restart/
              include-hidden-files: true
              if-no-files-found: ignore
              retention-days: 7
