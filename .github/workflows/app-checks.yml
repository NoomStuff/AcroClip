name: App checks
# The one definition of the Windows app checks, called by PR checks and releases
# alike so the two can never cover different things. The suites run on two
# runners side by side; each stages the same verified media and native helper.
"on":
   workflow_call:
      inputs:
         candidate_sha:
            type: string
            required: true
permissions:
   contents: read
jobs:
   app:
      name: ${{ matrix.suite }}
      strategy:
         fail-fast: false
         matrix:
            suite:
               - library
               - capture
      runs-on: windows-2025
      timeout-minutes: 45
      env:
         ACROCLIP_ISOLATED_TEST_RUNNER: github-hosted
         ACROCLIP_NATIVE_TEST_SOFTWARE: "1"
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha || github.sha }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
         - run: bun install --frozen-lockfile
         - name: Exercise Windows unit cases skipped by Linux verification
           if: matrix.suite == 'library'
           run: bun run test
         - uses: actions/download-artifact@v8
           with:
              name: controlled-windows-media
              path: work/
         - name: Verify and record the cross build on Windows
           run: bun scripts/controlled-media.ts
         - run: bun scripts/provision-media.ts
         - run: bun run bundle:media
         - run: bun run build:icons
         - run: bun run build:notices
         - uses: ./.github/actions/native-windows-cache
         - name: Stage the native helper used by real preview tests
           run: bun run build:native
         - run: bun run test:media
           if: matrix.suite == 'library'
         - name: Prepare private playback output for UI checks
           env:
              ACROCLIP_HOSTED_WINDOWS_FIXTURE: ${{ runner.environment }}
           run: pwsh -File scripts/setup-windows-runner-audio.ps1 -EndpointOnly
         - run: bun run test:ui
           if: matrix.suite == 'library'
         - run: bun run test:ui:native
           if: matrix.suite == 'capture'
         - name: Verify real input monitoring before any recording
           if: matrix.suite == 'capture'
           run: bun scripts/run-interactive-tests.ts audio-monitor
         - run: bun run test:capture-loss
           if: matrix.suite == 'capture'
         - uses: actions/upload-artifact@v7
           if: always()
           with:
              overwrite: true
              name: ui-verification-${{ matrix.suite }}
              path: |
                 test-results/
                 .cache/native-loss/**/events.json
                 .cache/native-loss/**/native.log
              include-hidden-files: true
              if-no-files-found: ignore
              retention-days: 7
